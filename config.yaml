# Research Agent — config.yaml
#
# Sistema completamente autónomo — no hay dependencias externas.
# Todos los paths se derivan de la ubicación de este archivo (AGENT_ROOT).
# Mueve la carpeta libremente y ejecuta: python3 setup.py
#
# knowledge_base/ está embebido dentro de este mismo repo:
#   knowledge_base/src/          ← motor RAG
#   knowledge_base/config/       ← topics.yaml
#   knowledge_base/data/chroma_db/ ← índice vectorial (generado, gitignored)
#   knowledge_base/input/        ← tus PDFs y documentos (Git LFS)

embedding:
  model: bge-m3
  base_url: http://localhost:11434
  dimensions: 1024

llm:
  local:
    model: qwen3:8b
    base_url: http://localhost:11434
    temperature: 0.2
    num_predict: 4096
  cloud:
    model: deepseek/deepseek-r1-0528:free
    base_url: https://openrouter.ai/api/v1

routing:
  confidence_high: 0.85
  confidence_low:  0.50

wiki:
  quality_threshold: 0.80
  session_preload_nodes: 4

context:
  max_budget_tokens: 3000
  wiki_first: true

data:
  supported_extensions:
    standard: [.pdf, .docx, .txt, .md, .csv, .xlsx, .json, .html]
    omics:    [.fasta, .fa, .vcf, .bed, .wig, .tsv, .gtf, .gff]

engram:
  project: research-agent
  bin: /usr/local/bin/engram
